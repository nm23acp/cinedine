<!DOCTYPE html>
<html>
<head>
    <title>Book Ticket</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .form-container {
            background: #1e1e1e;
            padding: 30px;
            border-radius: 10px;
            width: 300px;
            box-shadow: 0px 0px 10px black;
        }

        h1 {
            text-align: center;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border-radius: 5px;
            border: none;
        }

        button {
            background: #e50914;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="form-container">
    <h1>🎟 Book Ticket</h1>

    {% if messages %}
        {% for message in messages %}
            <p role="status">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Confirm Booking</button>
    </form>
</div>

</body>
</html>
